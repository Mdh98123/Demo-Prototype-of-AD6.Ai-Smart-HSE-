# CodeRabbit Configuration
# For more information, visit https://docs.coderabbit.ai/getting-started/configuration-file/

language: "en-US"
tone_instructions: "Be professional, concise, and focus on safety-critical aspects of the HSE application."

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poetic_summary: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "develop"

chat:
  enabled: true

# Safety-specific instructions for the HSE app
instructions: |
  - Pay special attention to data validation in safety forms.
  - Ensure that RBAC (Role-Based Access Control) is strictly followed in new modules.
  - Check for proper error handling in AI-integrated services.
  - Verify that all new UI components follow the established Tailwind CSS design system.
  - Ensure that sensitive safety data is handled securely.
