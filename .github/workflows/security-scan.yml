name: Security, Privacy & Vulnerability Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  security-audit:
    name: Dependency Audit & Guardrails Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run lint

      - name: Execute Migration RLS & Invariant Dry-Run
        run: node infra/migrations-runner.mjs --dry-run

      - name: NPM Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Generate CycloneDX & SPDX Software Bill of Materials (SBOM)
        run: node tools/security/generate_sbom.mjs

      - name: Run Full Acceptance & Regression Test Suite
        run: npm test

  container-scan:
    name: Container Image Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Production Container Image
        run: docker build -t ad6-hse-enterprise:latest .

      - name: Run Aqua Security Trivy Container Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ad6-hse-enterprise:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
