version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ad6-hse-api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://hse_admin:hse_secure_password_2026@postgres:5432/ad6_hse_enterprise?sslmode=disable
      - STATUTORY_CHANNEL_MODE=simulated
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=ad6_minio_admin
      - S3_SECRET_KEY=ad6_minio_super_secret_key
      - S3_BUCKET_EVIDENCE=ad6-hse-evidence
      - FEATURE_FLAG_DURABLE_PERSISTENCE=false
      - FEATURE_FLAG_STATUTORY_CLOCK=false
      - FEATURE_FLAG_AUDIT_LOG_V2=false
      - FEATURE_FLAG_SOD_DB_ENFORCED=false
      - FEATURE_FLAG_AI_GATES=false
      - FEATURE_FLAG_OFFLINE_SYNC_V2=false
      - FEATURE_FLAG_INTEGRATIONS=false
    volumes:
      - ../data:/app/applet/data
      - ../public:/app/applet/public
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - hse-enterprise-net

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ad6-hse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hse_admin
      POSTGRES_PASSWORD: hse_secure_password_2026
      POSTGRES_DB: ad6_hse_enterprise
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/0001_enterprise_rls_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hse_admin -d ad6_hse_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hse-enterprise-net

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: ad6-hse-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ad6_minio_admin
      MINIO_ROOT_PASSWORD: ad6_minio_super_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - hse-enterprise-net

volumes:
  postgres-data:
  minio-data:

networks:
  hse-enterprise-net:
    driver: bridge
