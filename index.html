    <script>
      (function() {
        var isDevHost = window.location.hostname.includes('ais-dev-') || 
                        window.location.hostname.includes('ais-pre-') || 
                        window.location.hostname.includes('run.app') ||
                        window.location.hostname.includes('localhost') || 
                        window.location.port === '3000' ||
                        window.location.port === '8080';
        if (isDevHost) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              keys.forEach(function(k) { caches.delete(k); });
            });
          }
        }
      })();
    </script>

              'xl': ['1.3125rem', { lineHeight: '1.875rem' }],   // 21px

            keyframes: {

              },
              slideUp: {

    <style>
      :root {
        --z-base: 0;
        --z-sticky-table: 10;
        --z-header: 20;
        --z-bottom-nav: 25;
        --z-sidebar: 30;
        --z-dropdown: 40;
        --z-safi: 45;
        --z-modal: 50;
        --z-toast: 60;
        
        --color-navy: #0F172A;
        --color-primary: #0052CC;
        --color-primary-hover: #0040A8;
        --color-surface: #FFFFFF;
        --color-bg: #F8FAFC;
        --color-border: #E2E8F0;
      }
      
      :root[data-theme="dark"], html.dark { 
        --color-navy: #0F172A;
        --color-bg: #0F172A;
        --color-surface: #1E293B;
        --color-border: #334155;
      }
      
      html, body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      /* Subtle industrial subtle pattern instead of pastel AI mesh slop */
      body {
        background-color: #F8FAFC;
        background-image: radial-gradient(#E2E8F0 1px, transparent 1px);
        background-size: 24px 24px;
        background-attachment: fixed;
      }
      
      /* --- ENTERPRISE INDUSTRIAL DESIGN SYSTEM SURFACES --- */
      
      .glass-panel, .enterprise-panel {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
        border-radius: 12px;
      }
      
      .glass-card, .enterprise-card {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.04), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
        border-radius: 12px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .glass-card:hover, .enterprise-card:hover {
        border-color: #CBD5E1;
        box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      }
      
      .glass-modal, .glass-dialog, .enterprise-modal {
        background: #FFFFFF;
        border: 1px solid #CBD5E1;
        box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
        border-radius: 16px;
      }
      
      .glass-sidebar, .enterprise-sidebar {
        background: #0F172A;
        border-right: 1px solid #1E293B;
      }
      
      .glass-header, .enterprise-header {
        background: #FFFFFF;
        border-bottom: 1px solid #E2E8F0;
      }
      
      .glass-toolbar, .enterprise-toolbar {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 8px;
      }
      
      .glass-table, .enterprise-table {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 8px;
        overflow: hidden;
      }
      
      .glass-widget, .enterprise-widget {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
        border-radius: 12px;
      }
      
      .glass-dropdown, .glass-popover, .enterprise-dropdown {
        background: #FFFFFF;
        border: 1px solid #CBD5E1;
        box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
        border-radius: 10px;
      }
      
      .glass-navigation {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 12px;
      }
      
      .glass-input, .enterprise-input {
        background: #FFFFFF !important;
        border: 1px solid #CBD5E1 !important;
        border-radius: 8px !important;
        color: #0F172A !important;
        transition: all 0.15s ease;
      }
      .glass-input:focus, .glass-input:focus-visible,
      .enterprise-input:focus, .enterprise-input:focus-visible {
        background: #FFFFFF !important;
        border-color: #0052CC !important;
        box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2) !important;
        outline: none;
      }
      
      .glass-button, .enterprise-button {
        background: #F1F5F9;
        border: 1px solid #E2E8F0;
        border-radius: 8px;
        color: #0F172A;
        font-weight: 600;
        transition: all 0.15s ease;
      }
      .glass-button:hover, .enterprise-button:hover {
        background: #E2E8F0;
        border-color: #CBD5E1;
      }
      
      /* Horizon UI Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      /* Directional Icon Flipper for RTL */
      html[dir="rtl"] .lucide-chevron-right, 
      html[dir="rtl"] .lucide-arrow-right,
      html[dir="rtl"] .lucide-arrow-up-right,
      html[dir="rtl"] .lucide-arrow-left {
        transform: scaleX(-1);
      }
      
      /* Arabic Typography standard for RTL */
      html[dir="rtl"], 
      html[lang="ar"], 
      .font-arabic,
      [dir="rtl"] body {
        font-family: 'Cairo', 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif !important;
        letter-spacing: 0 !important;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(203, 213, 225, 0.5); /* Neutral 300 transparent */
        backdrop-filter: blur(4px);
        border-radius: 10px;
        border: 2px solid transparent; /* Padding effect */
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(148, 163, 184, 0.7); /* Neutral 400 transparent */
      }
      /* Consistent Focus */
      *:focus-visible {
        outline: none;
        box-shadow: 0px 0px 0px 4px rgba(99, 102, 241, 0.15); /* Brand-500/15 */
      }
      
      /* Selection Color */
      ::selection {
        background-color: #C7D2FE; /* Brand 200 */
        color: #312E81; /* Brand 900 */
      }
    </style>
