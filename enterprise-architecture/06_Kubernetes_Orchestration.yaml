# Kubernetes Deployment & Orchestration Specifications
# Target: Azure Kubernetes Service (AKS)
# Architecture: Microservices, Event-Driven, Multi-Tenant

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hse-core-api
  namespace: hse-production
  labels:
    app: hse-core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hse-core
  template:
    metadata:
      labels:
        app: hse-core
    spec:
      containers:
      - name: hse-core-api
        image: acr.hse-platform.com/hse-core-api:v1.0.0
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hse-db-secrets
              key: database-url
        - name: KAFKA_BROKERS
          value: "hse-kafka-cluster:9092"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: hse-core-service
  namespace: hse-production
spec:
  type: ClusterIP
  selector:
    app: hse-core
  ports:
  - port: 80
    targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hse-platform-ingress
  namespace: hse-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WAF integration for UAE Data Residency compliance
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
spec:
  tls:
  - hosts:
    - api.hse-platform.com
    secretName: hse-tls-secret
  rules:
  - host: api.hse-platform.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hse-core-service
            port:
              number: 80
